<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <title>Chuck Norris Well Wishes Card</title>
  </head>
  <body>
    <h1>Welcome back <span id="user-name">Sibongile</span></h1>

    <div id="container">
      <label for="category">Select your category</label>
      <select name="category" id="category" disabled></select>

      <button id="fetch-joke">Get a new category joke! 💘</button>

      <h3 id="title">Well Wishing you nice Monday!</h3>

      <div class="card">
        <img
          src="https://media.cnn.com/api/v1/images/stellar/prod/120104060743-chuck-norris-gop-support.jpg?q=x_0,y_68,h_1141,w_2028,c_crop/h_833,w_1480"
          alt="Chuck Norris"
          class="chuck-img"
        />
      </div>

      <p id="display-joke">
        A Chuck Norris movie will touch your heart. Then it will rip it out of
        your chest!
      </p>
      <div class="logout-container">
        <button id="logout" onclick="handleLogout()">Logout</button>
      </div>
    </div>
  </body>
</html>
